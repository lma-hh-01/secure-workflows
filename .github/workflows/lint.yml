# Checks the hardened workflows of this repository (variant V3) with zizmor.
# The workflows of V0 to V2 are deliberately not hardened and are not checked.
name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

env:
  # renovate: datasource=pypi depName=zizmor
  ZIZMOR_VERSION: 1.32.0

jobs:
  zizmor:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2
        with:
          inputs: .github/workflows/v3.yml .github/workflows/v3-rescan.yml .github/workflows/lint.yml .github/workflows/renovate.yml
          config: zizmor.yml
          version: ${{ env.ZIZMOR_VERSION }}
          advanced-security: false
