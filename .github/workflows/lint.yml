# Prueft die gehaerteten Workflows dieses Repositories (Variante V3) mit zizmor.
# Die Workflows von V0 bis V2 sind absichtlich nicht gehaertet und werden nicht geprueft.
name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

env:
  # renovate: datasource=pypi depName=zizmor
  ZIZMOR_VERSION: 1.32.0

jobs:
  zizmor:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          inputs: .github/workflows/v3.yml .github/workflows/v3-rescan.yml .github/workflows/lint.yml
          config: zizmor.yml
          version: ${{ env.ZIZMOR_VERSION }}
          advanced-security: false
