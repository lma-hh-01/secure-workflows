# Renovate als Workflow der Plattform: haelt die gepinnten Abhaengigkeiten von V3
# in example-app und secure-workflows aktuell und oeffnet dafuer Pull Requests.
# Renovate laeuft bewusst hier und nicht als fertige App eines Anbieters: Seine
# Commits werden mit gitsign ueber die Identitaet dieses Workflows signiert und
# bestehen damit die Commit-Pruefung der zentralen Workflows ab V1.
name: renovate

on:
  schedule:
    - cron: '23 */4 * * *'
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

env:
  # renovate: datasource=github-releases depName=sigstore/gitsign extractVersion=^v(?<version>.*)$
  GITSIGN_VERSION: 0.18.0
  # renovate: datasource=npm depName=renovate
  RENOVATE_PACKAGE_VERSION: 44.239.1

jobs:
  renovate:
    runs-on: ubuntu-24.04
    permissions:
      # gitsign signiert die Commits mit dem OIDC-Token dieses Workflows.
      id-token: write
    steps:
      - name: Zugangstoken der Renovate-App holen (gilt eine Stunde)
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: example-app,secure-workflows
          # Nur die Rechte, die Renovate laut Doku braucht, nicht alle der Installation.
          permission-administration: read
          permission-checks: write
          permission-contents: write
          permission-issues: write
          permission-metadata: read
          permission-pull-requests: write
          permission-statuses: write
          permission-vulnerability-alerts: read
          permission-workflows: write

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: gitsign installieren und dessen Signatur pruefen
        run: |
          binary="gitsign_${GITSIGN_VERSION}_linux_amd64"
          release="https://github.com/sigstore/gitsign/releases/download/v${GITSIGN_VERSION}"
          curl -fsSL -o "$binary" "$release/$binary"
          curl -fsSL -o "$binary.bundle" "$release/$binary.bundle"
          cosign verify-blob --bundle "$binary.bundle" \
            --certificate-identity "https://github.com/sigstore/gitsign/.github/workflows/release.yml@refs/tags/v${GITSIGN_VERSION}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$binary"
          sudo install "$binary" /usr/local/bin/gitsign

      - name: Git so einrichten, dass jeder Commit mit gitsign signiert wird
        run: |
          git config --global gpg.format x509
          git config --global gpg.x509.program gitsign
          git config --global commit.gpgsign true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Renovate installieren und dessen Herkunft pruefen
        run: |
          mkdir -p "$RUNNER_TEMP/renovate"
          cd "$RUNNER_TEMP/renovate"
          npm init --yes >/dev/null
          npm install --no-fund --no-audit "renovate@${RENOVATE_PACKAGE_VERSION}"
          npm audit signatures
          echo "$RUNNER_TEMP/renovate/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Renovate ausfuehren
        env:
          RENOVATE_TOKEN: ${{ steps.app-token.outputs.token }}
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: '["${{ github.repository_owner }}/example-app", "${{ github.repository_owner }}/secure-workflows"]'
          # Mit Git committen statt ueber die GitHub-API. Ueber die API signiert GitHub
          # selbst, und diese Signatur unterscheidet den Bot nicht von einer Person.
          RENOVATE_PLATFORM_COMMIT: disabled
          # Beide Repositories bringen ihre renovate.json mit, kein Onboarding-PR.
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: required
          LOG_LEVEL: info
        run: |
          # Renovate gibt Kindprozessen wie git nur ausgewaehlte Variablen weiter.
          # gitsign braucht diese beiden, um das OIDC-Token des Workflows anzufordern.
          # Gezielt nur sie freigeben statt exposeAllEnv, das auch das App-Token weitergaebe.
          echo "::add-mask::$ACTIONS_ID_TOKEN_REQUEST_TOKEN"
          RENOVATE_CUSTOM_ENV_VARIABLES="$(jq -n \
            --arg url "$ACTIONS_ID_TOKEN_REQUEST_URL" \
            --arg token "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            '{ACTIONS_ID_TOKEN_REQUEST_URL: $url, ACTIONS_ID_TOKEN_REQUEST_TOKEN: $token}')"
          export RENOVATE_CUSTOM_ENV_VARIABLES
          renovate
