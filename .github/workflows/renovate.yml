# Renovate as a workflow of the platform: keeps the pinned dependencies of V3
# in example-app and secure-workflows up to date and opens pull requests for them.
# Renovate deliberately runs here and not as a vendor's ready-made app: its
# commits are signed with gitsign via the identity of this workflow and thus
# pass the commit verification of the central workflows from V1 on.
name: renovate

on:
  schedule:
    - cron: '23 */4 * * *'
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

env:
  # renovate: datasource=github-releases depName=sigstore/gitsign extractVersion=^v(?<version>.*)$
  GITSIGN_VERSION: 0.18.0
  # renovate: datasource=npm depName=renovate
  RENOVATE_PACKAGE_VERSION: 44.264.1

jobs:
  renovate:
    runs-on: ubuntu-24.04
    permissions:
      # gitsign signs the commits with the OIDC token of this workflow.
      id-token: write
    steps:
      - name: Fetch an access token of the Renovate app (valid for one hour)
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: example-app,secure-workflows
          # Only the permissions Renovate needs according to its docs, not all of the installation.
          permission-administration: read
          permission-checks: write
          permission-contents: write
          permission-issues: write
          permission-metadata: read
          permission-pull-requests: write
          permission-statuses: write
          permission-vulnerability-alerts: read
          permission-workflows: write

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Install gitsign and verify its signature
        run: |
          binary="gitsign_${GITSIGN_VERSION}_linux_amd64"
          release="https://github.com/sigstore/gitsign/releases/download/v${GITSIGN_VERSION}"
          curl -fsSL -o "$binary" "$release/$binary"
          curl -fsSL -o "$binary.bundle" "$release/$binary.bundle"
          cosign verify-blob --bundle "$binary.bundle" \
            --certificate-identity "https://github.com/sigstore/gitsign/.github/workflows/release.yml@refs/tags/v${GITSIGN_VERSION}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$binary"
          sudo install "$binary" /usr/local/bin/gitsign

      - name: Configure Git to sign every commit with gitsign
        run: |
          git config --global gpg.format x509
          git config --global gpg.x509.program gitsign
          git config --global commit.gpgsign true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install Renovate and verify its provenance
        run: |
          mkdir -p "$RUNNER_TEMP/renovate"
          cd "$RUNNER_TEMP/renovate"
          npm init --yes >/dev/null
          npm install --no-fund --no-audit "renovate@${RENOVATE_PACKAGE_VERSION}"
          npm audit signatures
          echo "$RUNNER_TEMP/renovate/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Run Renovate
        env:
          RENOVATE_TOKEN: ${{ steps.app-token.outputs.token }}
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: '["${{ github.repository_owner }}/example-app", "${{ github.repository_owner }}/secure-workflows"]'
          # Commit with Git instead of via the GitHub API. Via the API GitHub signs
          # the commit itself, and that signature does not distinguish the bot from a person.
          RENOVATE_PLATFORM_COMMIT: disabled
          # Both repositories ship their own renovate.json, no onboarding PR.
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: required
          LOG_LEVEL: info
        run: |
          # Renovate passes only selected variables on to child processes such as git.
          # gitsign needs these two to request the OIDC token of the workflow.
          # Allow exactly these instead of exposeAllEnv, which would also pass on the app token.
          echo "::add-mask::$ACTIONS_ID_TOKEN_REQUEST_TOKEN"
          RENOVATE_CUSTOM_ENV_VARIABLES="$(jq -n \
            --arg url "$ACTIONS_ID_TOKEN_REQUEST_URL" \
            --arg token "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            '{ACTIONS_ID_TOKEN_REQUEST_URL: $url, ACTIONS_ID_TOKEN_REQUEST_TOKEN: $token}')"
          export RENOVATE_CUSTOM_ENV_VARIABLES
          renovate
