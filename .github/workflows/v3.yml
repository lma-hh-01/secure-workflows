# Central workflow for variant V3, called by example-app.
# Like V2, plus before the build: zizmor checks the workflows of the
# application repository, the Kyverno CLI checks its Kubernetes manifests
# against the same policies as the cluster. After the build, Syft generates an
# SBOM, Grype scans it, and the image is only signed if the vulnerability gate
# passes. The SBOM is stored as a signed attestation.
# All third-party actions are pinned by commit SHA (maintained by Renovate).
name: v3

on:
  workflow_call:

permissions: {}

defaults:
  run:
    shell: bash

env:
  IMAGE: ghcr.io/${{ github.repository }}-v3
  # renovate: datasource=github-releases depName=sigstore/gitsign extractVersion=^v(?<version>.*)$
  GITSIGN_VERSION: 0.18.0
  # Who may sign commits (gitsign). One line per signer: email address in the
  # commit, expected identity in the certificate, issuer of the identity.
  # People log in via GitHub, Renovate signs via its workflow.
  ALLOWED_SIGNERS: |
    lma-hh-01@mailbox.org lma-hh-01@mailbox.org https://github.com/login/oauth
    354102089+lma-hh-01-testbed-renovate[bot]@users.noreply.github.com https://github.com/${{ github.repository_owner }}/secure-workflows/.github/workflows/renovate.yml@refs/heads/main https://token.actions.githubusercontent.com
  # Last commit of example-app before commit signatures were introduced.
  # Only the commits after it are verified. Deliberately kept here and not in the
  # application repository, so that the latter cannot move the anchor.
  TRUST_ANCHOR: 469390f0f078d28ba83f7c69c3ee23cbc627d04e
  # Key that GitHub uses to sign the merge commits of pull requests
  # (https://github.com/web-flow.gpg).
  WEB_FLOW_FINGERPRINT: 968479A1AFF927E37D1A566BB5690EEEBB952194
  # renovate: datasource=github-releases depName=kyverno/kyverno
  KYVERNO_VERSION: v1.19.2
  # renovate: datasource=pypi depName=zizmor
  ZIZMOR_VERSION: 1.32.0
  # renovate: datasource=github-releases depName=anchore/syft
  SYFT_VERSION: v1.57.0
  # renovate: datasource=github-releases depName=anchore/grype
  GRYPE_VERSION: v0.122.1
  # From this EPSS score on, the vulnerability gate blocks (see scripts/vulnerability-gate.sh).
  EPSS_THRESHOLD: "0.1"
  # Policies, gate script and zizmor configuration come from this repository.
  PLATFORM_DIR: platform

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Build main only
        run: |
          # The commit verification is defined for the history of main.
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Only main is built and signed, not $GITHUB_REF."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch policies and tool configuration of the platform
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/secure-workflows
          ref: main
          path: ${{ env.PLATFORM_DIR }}
          persist-credentials: false

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Install gitsign and verify its signature
        run: |
          binary="gitsign_${GITSIGN_VERSION}_linux_amd64"
          release="https://github.com/sigstore/gitsign/releases/download/v${GITSIGN_VERSION}"
          curl -fsSL -o "$binary" "$release/$binary"
          curl -fsSL -o "$binary.bundle" "$release/$binary.bundle"
          cosign verify-blob --bundle "$binary.bundle" \
            --certificate-identity "https://github.com/sigstore/gitsign/.github/workflows/release.yml@refs/tags/v${GITSIGN_VERSION}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$binary"
          sudo install "$binary" /usr/local/bin/gitsign

      - name: Verify commit signatures
        run: |
          # GitHub creates the merge commits on the first-parent line of main when
          # merging a pull request and signs them itself. Every other commit must be
          # signed with gitsign by an allowed person.
          curl -fsSL https://github.com/web-flow.gpg | gpg --quiet --import

          # Prints "<identity> <issuer>" for an allowed email address, otherwise nothing.
          signer_of() {
            awk -v email="$1" '$1 == email { print $2, $3 }' <<<"$ALLOWED_SIGNERS"
          }

          is_merge_on_main_line() {
            local commit="$1"
            git rev-parse --quiet --verify "$commit^2" >/dev/null &&
              git rev-list --first-parent "$TRUST_ANCHOR..HEAD" | grep -x "$commit" >/dev/null
          }

          verify_merge_commit() {
            # Only the fingerprint ensures that GitHub signed the commit and not
            # just any valid key.
            git verify-commit --raw "$1" 2>&1 | grep "VALIDSIG $WEB_FLOW_FINGERPRINT " >/dev/null
          }

          verify_gitsign_commit() {
            local commit="$1"
            local author committer identity issuer
            author="$(git log -1 --format=%ae "$commit")"
            committer="$(git log -1 --format=%ce "$commit")"
            [ -n "$(signer_of "$author")" ] || return 1
            read -r identity issuer <<<"$(signer_of "$committer")"
            [ -n "$identity" ] || return 1
            # gitsign only checks the certificate against the given identity.
            # The mapping above ensures that this identity belongs to the committer.
            gitsign verify --certificate-identity "$identity" \
              --certificate-oidc-issuer "$issuer" "$commit" >/dev/null 2>&1
          }

          if ! git merge-base --is-ancestor "$TRUST_ANCHOR" HEAD; then
            echo "::error::The trust anchor $TRUST_ANCHOR is not part of the history."
            exit 1
          fi

          failed=0
          for commit in $(git rev-list "$TRUST_ANCHOR..HEAD"); do
            if is_merge_on_main_line "$commit"; then
              kind="GitHub merge commit"
              verify_merge_commit "$commit" && result=ok || result=failed
            else
              kind="gitsign"
              verify_gitsign_commit "$commit" && result=ok || result=failed
            fi

            summary="$(git log -1 --format='%h %ae: %s' "$commit")"
            if [ "$result" = ok ]; then
              echo "OK      ($kind) $summary"
            else
              echo "::error::Signature invalid or not allowed ($kind): $summary"
              failed=1
            fi
          done
          exit "$failed"

      - name: Check workflows of the application repository (zizmor)
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          # Only the V3 files. V0 to V2 are deliberately not hardened.
          inputs: .github/workflows/v3.yml .github/workflows/v3-rescan.yml
          config: ${{ env.PLATFORM_DIR }}/zizmor.yml
          version: ${{ env.ZIZMOR_VERSION }}
          advanced-security: false

      - name: Install Kyverno CLI and verify its signature
        # kyverno/action-install-cli expects .sig and .pem files, but the releases
        # now only ship a Sigstore bundle. Hence done by hand, as for gitsign.
        run: |
          archive="kyverno-cli_${KYVERNO_VERSION}_linux_x86_64.tar.gz"
          release="https://github.com/kyverno/kyverno/releases/download/${KYVERNO_VERSION}"
          curl -fsSL -o "$archive" "$release/$archive"
          curl -fsSL -o "$archive.sigstore.json" "$release/$archive.sigstore.json"
          cosign verify-blob --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/kyverno/kyverno/.github/workflows/release.yaml@refs/tags/${KYVERNO_VERSION}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$archive"
          tar -xzf "$archive" kyverno
          sudo install kyverno /usr/local/bin/kyverno

      - name: Check Kubernetes manifests against the cluster policies
        run: kyverno apply "$PLATFORM_DIR/policies/v3/pod-security.yaml" --resource k8s/

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Record build time
        run: echo "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          # Pinned base image and dependencies with hashes (requirements.lock).
          file: Dockerfile.v3
          platforms: linux/amd64
          push: true
          # Without these two switches BuildKit creates an index with its own attestation.
          provenance: false
          sbom: false
          build-args: |
            APP_VARIANT=v3
            APP_COMMIT=${{ github.sha }}
            APP_BUILD_TIME=${{ env.BUILD_TIME }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}

      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          syft-version: ${{ env.SYFT_VERSION }}
          upload-artifact: false
          upload-release-assets: false

      - name: Scan SBOM for vulnerabilities (Grype)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: sbom.cdx.json
          grype-version: ${{ env.GRYPE_VERSION }}
          output-format: json
          output-file: grype.json
          # The gate script decides, not the severity alone.
          fail-build: false

      - name: Vulnerability gate
        run: |
          "$PLATFORM_DIR/scripts/vulnerability-gate.sh" grype.json

      - name: Hand the SBOM over to the signing job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 1

  attest:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      DIGEST: ${{ needs.build.outputs.digest }}
    steps:
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom

      - name: Sign image
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: Generate provenance and store it in the registry
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST }}
          push-to-registry: true
          # Storage records only exist for repositories owned by an organization.
          create-storage-record: false

      - name: Store SBOM as a signed attestation
        run: cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "$IMAGE@$DIGEST"
