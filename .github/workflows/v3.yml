# Zentraler Workflow fuer Variante V3, aufgerufen von example-app.
# Wie V2, zusaetzlich vor dem Build: zizmor prueft die Workflows des
# Anwendungs-Repositories, die Kyverno CLI prueft dessen Kubernetes-Manifeste
# mit denselben Richtlinien wie der Cluster. Nach dem Build erzeugt Syft eine
# SBOM, Grype wertet sie aus, und nur bei bestandenem Schwachstellen-Gate wird
# das Image signiert. Die SBOM wird als signierte Attestierung abgelegt.
# Alle fremden Actions sind per Commit-SHA gepinnt (gepflegt von Renovate).
name: v3

on:
  workflow_call:

permissions: {}

defaults:
  run:
    shell: bash

env:
  IMAGE: ghcr.io/${{ github.repository }}-v3
  # renovate: datasource=github-releases depName=sigstore/gitsign extractVersion=^v(?<version>.*)$
  GITSIGN_VERSION: 0.18.0
  # Wer Commits signieren darf (gitsign). Eine Zeile je Signierer: E-Mail-Adresse im
  # Commit, erwartete Identitaet im Zertifikat, Aussteller der Identitaet.
  # Personen melden sich ueber GitHub an, Renovate signiert ueber seinen Workflow.
  ALLOWED_SIGNERS: |
    lma-hh-01@mailbox.org lma-hh-01@mailbox.org https://github.com/login/oauth
    354102089+lma-hh-01-testbed-renovate[bot]@users.noreply.github.com https://github.com/${{ github.repository_owner }}/secure-workflows/.github/workflows/renovate.yml@refs/heads/main https://token.actions.githubusercontent.com
  # Letzter Commit von example-app vor Einfuehrung der Commit-Signaturen.
  # Geprueft werden nur die Commits danach. Liegt bewusst hier und nicht im
  # Anwendungs-Repository, damit dieses den Anker nicht verschieben kann.
  TRUST_ANCHOR: 439617b08d9a089ba10396bd57782087e1abd134
  # Schluessel, mit dem GitHub die Merge-Commits von Pull Requests signiert
  # (https://github.com/web-flow.gpg).
  WEB_FLOW_FINGERPRINT: 968479A1AFF927E37D1A566BB5690EEEBB952194
  # renovate: datasource=github-releases depName=kyverno/kyverno
  KYVERNO_VERSION: v1.20.0
  # renovate: datasource=pypi depName=zizmor
  ZIZMOR_VERSION: 1.32.0
  # renovate: datasource=github-releases depName=anchore/syft
  SYFT_VERSION: v1.57.0
  # renovate: datasource=github-releases depName=anchore/grype
  GRYPE_VERSION: v0.121.2
  # Ab diesem EPSS-Wert blockiert das Schwachstellen-Gate (siehe scripts/vulnerability-gate.sh).
  EPSS_THRESHOLD: "0.1"
  # Richtlinien, Gate-Skript und zizmor-Konfiguration kommen aus diesem Repository.
  PLATFORM_DIR: platform

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Nur main bauen
        run: |
          # Die Commit-Pruefung ist fuer die Historie von main festgelegt.
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Gebaut und signiert wird nur main, nicht $GITHUB_REF."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Richtlinien und Werkzeug-Konfiguration der Plattform holen
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/secure-workflows
          ref: main
          path: ${{ env.PLATFORM_DIR }}
          persist-credentials: false

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: gitsign installieren und dessen Signatur pruefen
        run: |
          binary="gitsign_${GITSIGN_VERSION}_linux_amd64"
          release="https://github.com/sigstore/gitsign/releases/download/v${GITSIGN_VERSION}"
          curl -fsSL -o "$binary" "$release/$binary"
          curl -fsSL -o "$binary.bundle" "$release/$binary.bundle"
          cosign verify-blob --bundle "$binary.bundle" \
            --certificate-identity "https://github.com/sigstore/gitsign/.github/workflows/release.yml@refs/tags/v${GITSIGN_VERSION}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$binary"
          sudo install "$binary" /usr/local/bin/gitsign

      - name: Commit-Signaturen pruefen
        run: |
          # Merge-Commits auf der Hauptlinie von main erzeugt GitHub beim Zusammenfuehren
          # eines Pull Requests und signiert sie selbst. Alle anderen Commits muss eine
          # erlaubte Person mit gitsign signiert haben.
          curl -fsSL https://github.com/web-flow.gpg | gpg --quiet --import

          # Gibt "<identitaet> <aussteller>" fuer eine erlaubte E-Mail-Adresse aus, sonst nichts.
          signer_of() {
            awk -v email="$1" '$1 == email { print $2, $3 }' <<<"$ALLOWED_SIGNERS"
          }

          is_merge_on_main_line() {
            local commit="$1"
            git rev-parse --quiet --verify "$commit^2" >/dev/null &&
              git rev-list --first-parent "$TRUST_ANCHOR..HEAD" | grep -x "$commit" >/dev/null
          }

          verify_merge_commit() {
            # Nur der Fingerabdruck stellt sicher, dass GitHub signiert hat und nicht
            # irgendein gueltiger Schluessel.
            git verify-commit --raw "$1" 2>&1 | grep "VALIDSIG $WEB_FLOW_FINGERPRINT " >/dev/null
          }

          verify_gitsign_commit() {
            local commit="$1"
            local author committer identity issuer
            author="$(git log -1 --format=%ae "$commit")"
            committer="$(git log -1 --format=%ce "$commit")"
            [ -n "$(signer_of "$author")" ] || return 1
            read -r identity issuer <<<"$(signer_of "$committer")"
            [ -n "$identity" ] || return 1
            # gitsign prueft nur das Zertifikat gegen die angegebene Identitaet.
            # Dass diese zum Committer passt, stellt die Zuordnung oben sicher.
            gitsign verify --certificate-identity "$identity" \
              --certificate-oidc-issuer "$issuer" "$commit" >/dev/null 2>&1
          }

          if ! git merge-base --is-ancestor "$TRUST_ANCHOR" HEAD; then
            echo "::error::Der Vertrauensanker $TRUST_ANCHOR ist nicht in der Historie enthalten."
            exit 1
          fi

          failed=0
          for commit in $(git rev-list "$TRUST_ANCHOR..HEAD"); do
            if is_merge_on_main_line "$commit"; then
              kind="Merge-Commit von GitHub"
              verify_merge_commit "$commit" && result=ok || result=failed
            else
              kind="gitsign"
              verify_gitsign_commit "$commit" && result=ok || result=failed
            fi

            summary="$(git log -1 --format='%h %ae: %s' "$commit")"
            if [ "$result" = ok ]; then
              echo "OK      ($kind) $summary"
            else
              echo "::error::Signatur ungueltig oder nicht erlaubt ($kind): $summary"
              failed=1
            fi
          done
          exit "$failed"

      - name: Workflows des Anwendungs-Repositories pruefen (zizmor)
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          # Nur die Dateien von V3. V0 bis V2 sind absichtlich nicht gehaertet.
          inputs: .github/workflows/v3.yml .github/workflows/v3-rescan.yml
          config: ${{ env.PLATFORM_DIR }}/zizmor.yml
          version: ${{ env.ZIZMOR_VERSION }}
          advanced-security: false

      - name: Kyverno CLI installieren und deren Signatur pruefen
        # kyverno/action-install-cli erwartet .sig und .pem, die Releases liefern
        # inzwischen nur noch ein Sigstore-Bundle. Deshalb wie bei gitsign von Hand.
        run: |
          archive="kyverno-cli_${KYVERNO_VERSION}_linux_x86_64.tar.gz"
          release="https://github.com/kyverno/kyverno/releases/download/${KYVERNO_VERSION}"
          curl -fsSL -o "$archive" "$release/$archive"
          curl -fsSL -o "$archive.sigstore.json" "$release/$archive.sigstore.json"
          cosign verify-blob --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/kyverno/kyverno/.github/workflows/release.yaml@refs/tags/${KYVERNO_VERSION}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$archive"
          tar -xzf "$archive" kyverno
          sudo install kyverno /usr/local/bin/kyverno

      - name: Kubernetes-Manifeste gegen die Richtlinien des Clusters pruefen
        run: kyverno apply "$PLATFORM_DIR/policies/v3/pod-security.yaml" --resource k8s/

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build-Zeit festhalten
        run: echo "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          # Gepinntes Basis-Image und Abhaengigkeiten mit Hashes (requirements.lock).
          file: Dockerfile.v3
          platforms: linux/amd64
          push: true
          # Ohne diese beiden Schalter legt BuildKit einen Index mit eigener Attestierung an.
          provenance: false
          sbom: false
          build-args: |
            APP_VARIANT=v3
            APP_COMMIT=${{ github.sha }}
            APP_BUILD_TIME=${{ env.BUILD_TIME }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}

      - name: SBOM erzeugen (Syft)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          syft-version: ${{ env.SYFT_VERSION }}
          upload-artifact: false
          upload-release-assets: false

      - name: SBOM auf Schwachstellen pruefen (Grype)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: sbom.cdx.json
          grype-version: ${{ env.GRYPE_VERSION }}
          output-format: json
          output-file: grype.json
          # Entschieden wird im Gate-Skript, nicht allein nach Schweregrad.
          fail-build: false

      - name: Schwachstellen-Gate
        run: |
          "$PLATFORM_DIR/scripts/vulnerability-gate.sh" grype.json

      - name: SBOM an den Signatur-Job uebergeben
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 1

  attest:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      DIGEST: ${{ needs.build.outputs.digest }}
    steps:
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom

      - name: Image signieren
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: Provenance erzeugen und in der Registry ablegen
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST }}
          push-to-registry: true
          # Speichereintraege gibt es nur fuer Repositories von Organisationen.
          create-storage-record: false

      - name: SBOM als signierte Attestierung ablegen
        run: cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "$IMAGE@$DIGEST"
