# Zentraler Workflow fuer Variante V2, aufgerufen von example-app.
# Wie V1, aber Build und Signierung laufen in getrennten Jobs: Nur der Job
# "attest" darf ein OIDC-Token anfordern, und er fuehrt keinen Code aus dem
# Anwendungs-Repository aus. Er signiert das Image und legt eine Provenance
# (Herkunftsnachweis nach SLSA) in der Registry ab.
name: v2

on:
  workflow_call:

defaults:
  run:
    shell: bash

env:
  IMAGE: ghcr.io/${{ github.repository }}-v2
  GITSIGN_VERSION: 0.18.0
  # Wer Commits signieren darf (gitsign, Anmeldung ueber GitHub). Mehrere durch Leerzeichen trennen.
  ALLOWED_SIGNERS: lma-hh-01@mailbox.org
  SIGNER_ISSUER: https://github.com/login/oauth
  # Letzter Commit von example-app vor Einfuehrung der Commit-Signaturen.
  # Geprueft werden nur die Commits danach. Liegt bewusst hier und nicht im
  # Anwendungs-Repository, damit dieses den Anker nicht verschieben kann.
  TRUST_ANCHOR: 439617b08d9a089ba10396bd57782087e1abd134
  # Schluessel, mit dem GitHub die Merge-Commits von Pull Requests signiert
  # (https://github.com/web-flow.gpg).
  WEB_FLOW_FINGERPRINT: 968479A1AFF927E37D1A566BB5690EEEBB952194

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Nur main bauen
        run: |
          # Die Commit-Pruefung ist fuer die Historie von main festgelegt.
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Gebaut und signiert wird nur main, nicht $GITHUB_REF."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: sigstore/cosign-installer@v4.1.3

      - name: gitsign installieren und dessen Signatur pruefen
        run: |
          binary="gitsign_${GITSIGN_VERSION}_linux_amd64"
          release="https://github.com/sigstore/gitsign/releases/download/v${GITSIGN_VERSION}"
          curl -fsSL -o "$binary" "$release/$binary"
          curl -fsSL -o "$binary.bundle" "$release/$binary.bundle"
          cosign verify-blob --bundle "$binary.bundle" \
            --certificate-identity "https://github.com/sigstore/gitsign/.github/workflows/release.yml@refs/tags/v${GITSIGN_VERSION}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$binary"
          sudo install "$binary" /usr/local/bin/gitsign

      - name: Commit-Signaturen pruefen
        run: |
          # Merge-Commits auf der Hauptlinie von main erzeugt GitHub beim Zusammenfuehren
          # eines Pull Requests und signiert sie selbst. Alle anderen Commits muss eine
          # erlaubte Person mit gitsign signiert haben.
          curl -fsSL https://github.com/web-flow.gpg | gpg --quiet --import

          is_allowed_signer() {
            case " $ALLOWED_SIGNERS " in
              *" $1 "*) return 0 ;;
              *) return 1 ;;
            esac
          }

          is_merge_on_main_line() {
            local commit="$1"
            git rev-parse --quiet --verify "$commit^2" >/dev/null &&
              git rev-list --first-parent "$TRUST_ANCHOR..HEAD" | grep -x "$commit" >/dev/null
          }

          verify_merge_commit() {
            # Nur der Fingerabdruck stellt sicher, dass GitHub signiert hat und nicht
            # irgendein gueltiger Schluessel.
            git verify-commit --raw "$1" 2>&1 | grep "VALIDSIG $WEB_FLOW_FINGERPRINT " >/dev/null
          }

          verify_gitsign_commit() {
            local commit="$1"
            local author committer
            author="$(git log -1 --format=%ae "$commit")"
            committer="$(git log -1 --format=%ce "$commit")"
            # gitsign prueft nur das Zertifikat gegen die angegebene Identitaet.
            # Dass diese zum Commit passt, muss hier geprueft werden.
            is_allowed_signer "$author" && is_allowed_signer "$committer" &&
              gitsign verify --certificate-identity "$committer" \
                --certificate-oidc-issuer "$SIGNER_ISSUER" "$commit" >/dev/null 2>&1
          }

          if ! git merge-base --is-ancestor "$TRUST_ANCHOR" HEAD; then
            echo "::error::Der Vertrauensanker $TRUST_ANCHOR ist nicht in der Historie enthalten."
            exit 1
          fi

          failed=0
          for commit in $(git rev-list "$TRUST_ANCHOR..HEAD"); do
            if is_merge_on_main_line "$commit"; then
              kind="Merge-Commit von GitHub"
              verify_merge_commit "$commit" && result=ok || result=failed
            else
              kind="gitsign"
              verify_gitsign_commit "$commit" && result=ok || result=failed
            fi

            summary="$(git log -1 --format='%h %ae: %s' "$commit")"
            if [ "$result" = ok ]; then
              echo "OK      ($kind) $summary"
            else
              echo "::error::Signatur ungueltig oder nicht erlaubt ($kind): $summary"
              failed=1
            fi
          done
          exit "$failed"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build-Zeit festhalten
        run: echo "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          # Ohne diese beiden Schalter legt BuildKit einen Index mit eigener Attestierung an.
          provenance: false
          sbom: false
          build-args: |
            APP_VARIANT=v2
            APP_COMMIT=${{ github.sha }}
            APP_BUILD_TIME=${{ env.BUILD_TIME }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}

  attest:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      DIGEST: ${{ needs.build.outputs.digest }}
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@v4.1.3

      - name: Image signieren
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: Provenance erzeugen und in der Registry ablegen
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST }}
          push-to-registry: true
          # Speichereintraege gibt es nur fuer Repositories von Organisationen.
          create-storage-record: false
