# Central workflow for variant V3: repeats the vulnerability gate for the most
# recently built image without rebuilding it. This way new vulnerabilities are
# detected even when the code does not change. It is based on the signed SBOM
# from the build, not on a new analysis of the image.
# A blocking finding makes this run fail.
name: v3-rescan

on:
  workflow_call:

permissions: {}

defaults:
  run:
    shell: bash

env:
  IMAGE: ghcr.io/${{ github.repository }}-v3
  # The SBOM must be signed by the central V3 workflow.
  SBOM_SIGNER: https://github.com/${{ github.repository_owner }}/secure-workflows/.github/workflows/v3.yml@refs/heads/main
  # renovate: datasource=github-releases depName=anchore/grype
  GRYPE_VERSION: v0.121.2
  EPSS_THRESHOLD: "0.1"
  PLATFORM_DIR: platform

jobs:
  rescan:
    runs-on: ubuntu-24.04
    permissions:
      # Reads the runs of the build workflow to find the most recently built image.
      actions: read
    steps:
      - name: Fetch the gate script of the platform
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/secure-workflows
          ref: main
          path: ${{ env.PLATFORM_DIR }}
          persist-credentials: false

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Fetch the signed SBOM of the most recently built image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          commit="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow v3.yml --branch main \
            --status success --limit 1 --json headSha --jq '.[0].headSha')"
          echo "Image: $IMAGE:$commit"
          # Several builds of the same commit leave several SBOMs on the image, the last one counts.
          cosign verify-attestation --type cyclonedx \
            --certificate-identity "$SBOM_SIGNER" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$IMAGE:$commit" > attestations.json
          tail -n 1 attestations.json | jq -r '.payload' | base64 -d | jq '.predicate' > sbom.cdx.json

      - name: Scan SBOM for vulnerabilities (Grype)
        uses: anchore/scan-action@11983a512817154c80a9db660c1a184be7513ed6 # v7.4.3
        with:
          sbom: sbom.cdx.json
          grype-version: ${{ env.GRYPE_VERSION }}
          output-format: json
          output-file: grype.json
          fail-build: false

      - name: Vulnerability gate
        run: |
          "$PLATFORM_DIR/scripts/vulnerability-gate.sh" grype.json
