# Configuration for zizmor (checks of GitHub workflows) from variant V3 on.
rules:
  unpinned-uses:
    config:
      policies:
        # Application repositories deliberately call the central workflow via @main:
        # Kyverno checks its identity including refs/heads/main. Pinning a commit
        # would let the application repository choose an old version.
        "lma-hh-01/secure-workflows/*": ref-pin
        "*": hash-pin
