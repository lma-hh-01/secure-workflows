# Variant V3: minimum requirements for the security configuration of pods,
# based on the "restricted" profile of the Kubernetes Pod Security Standards.
# The pipeline (Kyverno CLI on the manifests) and the cluster (admission) check
# the same policy, so that both decide by one set of rules.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: pod-security
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  evaluation:
    background:
      enabled: false
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system, local-path-storage, kyverno]
    resourceRules:
      - apiGroups: ['']
        apiVersions: ['v1']
        operations: ['CREATE', 'UPDATE']
        resources: ['pods']
  variables:
    - name: containers
      expression: >-
        object.spec.containers
        + object.spec.?initContainers.orValue([])
        + object.spec.?ephemeralContainers.orValue([])
  validations:
    - expression: >-
        variables.containers.all(c, !c.?securityContext.?privileged.orValue(false))
      message: 'Privileged containers are not allowed'
    - expression: >-
        variables.containers.all(c, c.?securityContext.?allowPrivilegeEscalation.orValue(true) == false)
      message: 'Every container must set allowPrivilegeEscalation: false'
    - expression: >-
        variables.containers.all(c,
          c.?securityContext.?runAsNonRoot.orValue(object.spec.?securityContext.?runAsNonRoot.orValue(false)))
      message: 'Containers must run with runAsNonRoot: true'
    - expression: >-
        object.spec.?securityContext.?runAsUser.orValue(1) != 0
        && variables.containers.all(c, c.?securityContext.?runAsUser.orValue(1) != 0)
      message: 'Containers must not run as root (user 0)'
    - expression: >-
        variables.containers.all(c, c.?securityContext.?capabilities.?drop.orValue([]).exists(d, d == 'ALL'))
      message: 'Every container must drop all Linux capabilities (drop: [ALL])'
    - expression: >-
        !object.spec.?hostNetwork.orValue(false)
        && !object.spec.?hostPID.orValue(false)
        && !object.spec.?hostIPC.orValue(false)
      message: 'Host namespaces (network, PID, IPC) are not allowed'
    - expression: >-
        !object.spec.?volumes.orValue([]).exists(v, has(v.hostPath))
      message: 'hostPath volumes are not allowed'
