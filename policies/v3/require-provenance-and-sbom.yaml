# Variante V3: wie V2 (Signatur und Provenance des zentralen Workflows, Herkunft
# aus example-app, Branch main, Ausloesung per Push), zusaetzlich muss eine vom
# zentralen Workflow signierte SBOM (CycloneDX) am Image haengen. Sie belegt,
# dass das Image das Schwachstellen-Gate durchlaufen hat, und ist die Grundlage
# fuer die taegliche Wiederholung der Auswertung.
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: require-provenance-and-sbom
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  webhookConfiguration:
    timeoutSeconds: 15
  evaluation:
    background:
      enabled: false
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system, local-path-storage, kyverno]
    resourceRules:
      - apiGroups: ['']
        apiVersions: ['v1']
        operations: ['CREATE', 'UPDATE']
        resources: ['pods']
  validationConfigurations:
    # Jedes Image des Pods muss geprueft sein, auch Init-Container.
    required: true
    verifyDigest: true
    mutateDigest: false
  attestors:
    - name: pipeline
      cosign:
        keyless:
          identities:
            - subject: 'https://github.com/lma-hh-01/secure-workflows/.github/workflows/v3.yml@refs/heads/main'
              issuer: 'https://token.actions.githubusercontent.com'
        ctlog:
          url: 'https://rekor.sigstore.dev'
  attestations:
    - name: provenance
      intoto:
        type: https://slsa.dev/provenance/v1
    - name: sbom
      intoto:
        type: https://cyclonedx.org/bom
  variables:
    - name: expectedRepository
      expression: "'https://github.com/lma-hh-01/example-app'"
  validations:
    - expression: >-
        images.containers.map(image, verifyImageSignatures(image, [attestors.pipeline])).all(e, e > 0)
      message: 'Image ist nicht vom zentralen Workflow signiert'
    - expression: >-
        images.containers.map(image, verifyAttestationSignatures(image, attestations.provenance, [attestors.pipeline])).all(e, e > 0)
      message: 'Provenance fehlt oder ist nicht vom zentralen Workflow signiert'
    - expression: >-
        images.containers.map(image, verifyAttestationSignatures(image, attestations.sbom, [attestors.pipeline])).all(e, e > 0)
      message: 'SBOM fehlt oder ist nicht vom zentralen Workflow signiert'
    - expression: >-
        images.containers.map(image,
          extractPayload(image, attestations.provenance).predicate.buildDefinition.externalParameters.workflow.repository == variables.expectedRepository
        ).all(e, e)
      message: 'Provenance: Image stammt nicht aus example-app'
    - expression: >-
        images.containers.map(image,
          extractPayload(image, attestations.provenance).predicate.buildDefinition.externalParameters.workflow.ref == 'refs/heads/main'
        ).all(e, e)
      message: 'Provenance: Image wurde nicht vom Branch main gebaut'
    - expression: >-
        images.containers.map(image,
          extractPayload(image, attestations.provenance).predicate.buildDefinition.internalParameters.github.event_name == 'push'
        ).all(e, e)
      message: 'Provenance: Build wurde nicht durch einen Push ausgeloest'
