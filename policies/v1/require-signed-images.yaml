# Variant V1: pods may only use images signed by the V1 workflow of
# example-app and must reference them by their digest.
# Applies to all images from all registries, only the namespaces of the
# cluster itself are excluded.
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: require-signed-images
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  webhookConfiguration:
    timeoutSeconds: 15
  evaluation:
    background:
      enabled: false
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system, local-path-storage, kyverno]
    resourceRules:
      - apiGroups: ['']
        apiVersions: ['v1']
        operations: ['CREATE', 'UPDATE']
        resources: ['pods']
  validationConfigurations:
    # Every image of the pod must be verified, including init containers.
    required: true
    verifyDigest: true
    mutateDigest: false
  attestors:
    - name: pipeline
      cosign:
        keyless:
          identities:
            - subject: 'https://github.com/lma-hh-01/example-app/.github/workflows/v1.yml@refs/heads/main'
              issuer: 'https://token.actions.githubusercontent.com'
        ctlog:
          url: 'https://rekor.sigstore.dev'
  validations:
    - expression: >-
        images.containers.map(image, verifyImageSignatures(image, [attestors.pipeline])).all(e, e > 0)
      message: 'Image is not signed by the V1 workflow of example-app'
