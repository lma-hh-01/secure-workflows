# Variant V2: like V1, and additionally a provenance (build origin attestation
# according to SLSA) of the central workflow must be present. It must prove that
# the image was built from example-app, from branch main and by a push. Any
# repository can call the central workflow, so its identity alone is not
# enough.
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: require-provenance
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  webhookConfiguration:
    timeoutSeconds: 15
  evaluation:
    background:
      enabled: false
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system, local-path-storage, kyverno]
    resourceRules:
      - apiGroups: ['']
        apiVersions: ['v1']
        operations: ['CREATE', 'UPDATE']
        resources: ['pods']
  validationConfigurations:
    # Every image of the pod must be verified, including init containers.
    required: true
    verifyDigest: true
    mutateDigest: false
  attestors:
    - name: pipeline
      cosign:
        keyless:
          identities:
            - subject: 'https://github.com/lma-hh-01/secure-workflows/.github/workflows/v2.yml@refs/heads/main'
              issuer: 'https://token.actions.githubusercontent.com'
        ctlog:
          url: 'https://rekor.sigstore.dev'
  attestations:
    - name: provenance
      intoto:
        type: https://slsa.dev/provenance/v1
  variables:
    - name: expectedRepository
      expression: "'https://github.com/lma-hh-01/example-app'"
  validations:
    - expression: >-
        images.containers.map(image, verifyImageSignatures(image, [attestors.pipeline])).all(e, e > 0)
      message: 'Image is not signed by the central workflow'
    - expression: >-
        images.containers.map(image, verifyAttestationSignatures(image, attestations.provenance, [attestors.pipeline])).all(e, e > 0)
      message: 'Provenance is missing or not signed by the central workflow'
    - expression: >-
        images.containers.map(image,
          extractPayload(image, attestations.provenance).predicate.buildDefinition.externalParameters.workflow.repository == variables.expectedRepository
        ).all(e, e)
      message: 'Provenance: image was not built from example-app'
    - expression: >-
        images.containers.map(image,
          extractPayload(image, attestations.provenance).predicate.buildDefinition.externalParameters.workflow.ref == 'refs/heads/main'
        ).all(e, e)
      message: 'Provenance: image was not built from branch main'
    - expression: >-
        images.containers.map(image,
          extractPayload(image, attestations.provenance).predicate.buildDefinition.internalParameters.github.event_name == 'push'
        ).all(e, e)
      message: 'Provenance: build was not triggered by a push'
